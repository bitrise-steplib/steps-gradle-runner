format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  # Shared test configs
  - ORIG_BITRISE_SOURCE_DIR: $BITRISE_SOURCE_DIR
  - BUILD_ROOT_DIRECTORY: .
  - MAPPING_FILE_INCLUDE_FILTER: "*/release/mapping.txt"

workflows:
  test:
    description: Debug option specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --debug
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk
    - _check_log_output

  test_invalid_task:
    steps:
    - script:
        title: Start a failing workflow, wrapped in a script.
        inputs:
        - content: |-
            #!/bin/env bash
            set -x # Do not set -e as bitrise command is expected to fail
            bitrise run --config=./e2e/bitrise.yml utility_test_invalid_task
            if [ $? -ne 1 ] ; then
              echo "Workflow was excepted to fail, exit code not 1."
              exit 1
            fi

  utility_test_invalid_task:
    description: Invalid task specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: nonexistentTask
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common

  test_invalid_task_debug:
    steps:
    - script:
        title: Start a failing workflow, wrapped in a script.
        inputs:
        - content: |-
            #!/bin/env bash
            set -x # Do not set -e as bitrise command is expected to fail
            bitrise run --config=./e2e/bitrise.yml utility_test_invalid_task_debug
            if [ $? -ne 1 ] ; then
              echo "Workflow was excepted to fail, exit code not 1."
              exit 1
            fi

  utility_test_invalid_task_debug:
    description: Invalid task specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: nonexistentTask
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --debug
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_log_output

  test_aab:
    description: App bundle (.aab)
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: bundle
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_aab
    - _check_output_artifact_map

  test_gradlew_path:
    description: Use 'gradlew' as Gradle wrapper path
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  test_multiple_tasks:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug assembleRelease
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk
    - _check_output_artifact_map

  test_subdir:
    description: Source code is in a subdirectory
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: ./src
    - BUILD_ROOT_DIRECTORY: ./src
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  test-no-gradlew-error:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-sdk22-no-gradlew.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ""
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  # Ouptuts an *.aar
  test_no_root_buildfile:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-empty-library.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common

  test_apk_split:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-abi-split.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk
    # multiple APKs per variant is the artifact map's flagship scenario
    - _check_output_artifact_map

  test_original_issue:
    description: |-
      Reproduces the SSW-3065 customer report: a single-variant build where three
      files match a widened mapping filter — the Compose mapping, the R8 task's
      intermediates workdir copy, and the official outputs/ copy. The legacy
      BITRISE_MAPPING_PATH lands on a collision-renamed file; the artifact map must
      pair the variant with the official outputs/ copy and keep the Compose mapping
      visible under unmatched.
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: recreate _tmp directory
        inputs:
        - content: rm -rf "$ORIG_BITRISE_SOURCE_DIR/_tmp" && mkdir "$ORIG_BITRISE_SOURCE_DIR/_tmp"
    - change-workdir:
        title: Switch working dir to _tmp dir
        run_if: "true"
        inputs:
        - path: $ORIG_BITRISE_SOURCE_DIR/_tmp
    # cloned only for its Gradle wrapper — the build files are replaced below
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: https://github.com/bitrise-io/bitrise-android-sample.git
        - clone_into_dir: .
        - branch: main
    - script:
        title: Replace the project with the SSW-3065 fixture layout generator
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            # a plain (non-Android) Gradle project: no SDK or AGP needed, the
            # task just recreates the customer's build-output tree
            cat > settings.gradle <<'EOF'
            rootProject.name = 'repro-original-issue'
            EOF
            cat > build.gradle <<'EOF'
            tasks.register("reproOriginalIssue") {
              doLast {
                def base = new File(projectDir, "app/build")
                [
                  "intermediates/compose_mapping/productionRelease/compose-mapping.txt",
                  "intermediates/mapping/productionRelease/minifyProductionReleaseWithR8/mapping.txt",
                  "outputs/mapping/productionRelease/mapping.txt",
                  "outputs/apk/production/release/app-production-release.apk",
                ].each { p ->
                  def f = new File(base, p)
                  f.parentFile.mkdirs()
                  f.text = "fixture-source: " + p
                }
              }
            }
            EOF
    - path::./:
        title: Self-test (customer-like widened mapping filter)
        inputs:
        - build_root_directory: .
        - gradle_task: reproOriginalIssue
        - gradlew_path: ./gradlew
        - mapping_file_include_filter: "*mapping.txt"
    - script:
        title: Check the original issue is repro'd and the map resolves it
        is_always_run: true
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            echo "BITRISE_MAPPING_PATH: $BITRISE_MAPPING_PATH"
            map="$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            map_dir=$(dirname "$map")

            # the historical collision happened: a renamed mapping<timestamp>.txt exists
            ls "$map_dir" | grep -qE '^mapping[0-9]+\.txt$' \
              || { echo "expected a collision-renamed mapping<timestamp>.txt in the deploy dir"; ls -la "$map_dir"; exit 1; }

            jq -e '.modules.app.productionRelease.apk == ["app-production-release.apk"]' "$map" > /dev/null \
              || { echo "expected the variant's APK paired in the map"; cat "$map"; exit 1; }
            jq -e '.unmatched.mapping == ["compose-mapping.txt"]' "$map" > /dev/null \
              || { echo "expected compose-mapping.txt under unmatched"; cat "$map"; exit 1; }

            mapping_name=$(jq -r '.modules.app.productionRelease.mapping' "$map")
            if [ -z "$mapping_name" ] || [ "$mapping_name" = "null" ]; then
              echo "expected a mapping paired for productionRelease"; cat "$map"; exit 1
            fi
            # content proof: the OFFICIAL outputs/ copy won, not the intermediates
            # workdir copy, regardless of copy order and collision renames
            grep -q "fixture-source: outputs/mapping/productionRelease" "$map_dir/$mapping_name" \
              || { echo "the paired mapping ($mapping_name) is not the official outputs/ copy:"; cat "$map_dir/$mapping_name"; exit 1; }
            echo "OK: productionRelease paired with the official outputs/ mapping ($mapping_name)"

  test_compose_r8:
    description: |-
      Real Compose + R8 build (SSW-3065): R8 writes mapping.txt next to its
      configuration/seeds/usage.txt reports, and a widened mapping filter drags all
      of them into the deploy dir. The artifact map must pair the variant with the
      real mapping.txt — the report files lose on rank, not by accident.
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: recreate _tmp directory
        inputs:
        - content: rm -rf "$ORIG_BITRISE_SOURCE_DIR/_tmp" && mkdir "$ORIG_BITRISE_SOURCE_DIR/_tmp"
    - change-workdir:
        title: Switch working dir to _tmp dir
        run_if: "true"
        inputs:
        - path: $ORIG_BITRISE_SOURCE_DIR/_tmp
    # TODO: point at bitrise-io/samples-android-todo-kotlin-and-compose once
    # https://github.com/bitrise-io/samples-android-todo-kotlin-and-compose/pull/5 merges
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: https://github.com/lpusok/samples-android-todo-kotlin-and-compose.git
        - clone_into_dir: .
        - branch: SSW-3065-compose-r8
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: Self-test (widened mapping filter drags in the R8 report files)
        inputs:
        - build_root_directory: .
        - gradle_task: assembleRelease
        - gradlew_path: ./gradlew
        - mapping_file_include_filter: |-
            *mapping.txt
            */outputs/mapping/*/*.txt
    - script:
        title: Check the map pairs the real R8 mapping, not a report file
        is_always_run: true
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            map="$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            map_dir=$(dirname "$map")

            # the widened filter really dragged the R8 report files in
            [ -f "$map_dir/usage.txt" ] && [ -f "$map_dir/seeds.txt" ] \
              || { echo "expected the R8 report files in the deploy dir"; ls -la "$map_dir"; exit 1; }

            jq -e '.modules.app.release.apk == ["app-release-unsigned.apk"]' "$map" > /dev/null \
              || { echo "expected the release APK paired in the map"; cat "$map"; exit 1; }
            mapping_name=$(jq -r '.modules.app.release.mapping' "$map")
            if [ "$mapping_name" != "mapping.txt" ]; then
              echo "expected mapping.txt paired for app/release, got '$mapping_name'"; cat "$map"; exit 1
            fi
            # content proof: it is R8's real mapping file
            head -1 "$map_dir/$mapping_name" | grep -q "compiler: R8" \
              || { echo "paired mapping does not look like an R8 mapping:"; head -3 "$map_dir/$mapping_name"; exit 1; }
            echo "OK: app/release paired with R8's mapping.txt; report files dropped by rank"

  test_duckduckgo:
    description: |-
      Full-scale real-world SSW-3065 repro on the DuckDuckGo app (AGP 8.13, Compose,
      ~400 modules): two minified release flavors produce the complete customer
      layout per variant — outputs/mapping/, the intermediates minify*WithR8
      duplicate AND the Compose mapping — with a cascade of deploy-dir collision
      renames. The artifact map must pair each flavor with its own official
      outputs/ mapping. Gradle dependency cache + Bitrise remote build cache keep
      warm runs fast.
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "21"
    - script:
        title: recreate _tmp directory
        inputs:
        - content: rm -rf "$ORIG_BITRISE_SOURCE_DIR/_tmp" && mkdir "$ORIG_BITRISE_SOURCE_DIR/_tmp"
    - change-workdir:
        title: Switch working dir to _tmp dir
        run_if: "true"
        inputs:
        - path: $ORIG_BITRISE_SOURCE_DIR/_tmp
    # TODO: point at bitrise-io/DuckDuckGo-Android once the fixture patch can
    # live there (no push access yet); the fixture branch only enables R8 on
    # release and dontwarn's leaked compile-only lint classes
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: https://github.com/lpusok/DuckDuckGo-Android.git
        - clone_into_dir: .
        - branch: SSW-3065-minified-fixture
    - script:
        title: Init git submodules (native bloom filter sources)
        inputs:
        - content: git submodule update --init --recursive --depth 1
    - restore-gradle-cache@2: {}
    - activate-build-cache-for-gradle@3:
        # remote build cache is an add-on; a build without it must still pass
        is_skippable: true
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: ./gradlew
        - ndk_version: 28.2.13676358
    - script:
        title: Size Gradle JVM heap to the machine
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            # R8 over the full app OOMs with the project's default -Xmx6g, while a
            # heap sized for a big machine OOM-kills the daemon on a small one; give
            # the daemons a share of the actual RAM so the same workflow fits medium
            # (16GB -> 8g/2g/3) and large (32GB -> 15g/3g/6) workers alike
            if [ -r /proc/meminfo ]; then
              total_gb=$(awk '/MemTotal/ {printf "%.0f", $2/1024/1024}' /proc/meminfo)
            else
              total_gb=$(($(sysctl -n hw.memsize) / 1024 / 1024 / 1024))
            fi
            envman add --key GRADLE_DAEMON_HEAP --value "$((total_gb / 2))g"
            envman add --key KOTLIN_DAEMON_HEAP --value "$((total_gb / 8))g"
            envman add --key GRADLE_MAX_WORKERS --value "$((total_gb / 5))"
    - path::./:
        title: Self-test (two minified flavors, customer-like widened filter)
        inputs:
        - build_root_directory: .
        - gradle_task: assembleInternalRelease assemblePlayRelease
        - gradlew_path: ./gradlew
        - gradle_options: -PuseProprietaryFont=false "-Pkotlin.daemon.jvmargs=-Xmx$KOTLIN_DAEMON_HEAP" --max-workers=$GRADLE_MAX_WORKERS "-Dorg.gradle.jvmargs=-Xmx$GRADLE_DAEMON_HEAP -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"
        - mapping_file_include_filter: "*mapping.txt"
    - script:
        title: Check per-flavor pairing on the full customer layout
        is_always_run: true
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            map="$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            echo "--- artifact map ---"; cat "$map"; echo "--------------------"

            internal=$(jq -r '.modules.app.internalRelease.mapping // ""' "$map")
            play=$(jq -r '.modules.app.playRelease.mapping // ""' "$map")
            [ -n "$internal" ] && [ -n "$play" ] \
              || { echo "expected a mapping paired for both flavors"; exit 1; }
            [ "$internal" != "$play" ] \
              || { echo "the two flavors must not share a mapping file"; exit 1; }
            # the intermediates copy is discovered first and claims the plain
            # mapping.txt name; the official outputs/ copies are collision-renamed,
            # so a paired plain name would mean the WRONG (intermediates) file won
            [ "$internal" != "mapping.txt" ] && [ "$play" != "mapping.txt" ] \
              || { echo "a flavor was paired with the intermediates copy"; exit 1; }

            jq -e '.modules.app.internalRelease.apk | length == 1 and (.[0] | test("internal-release"))' "$map" > /dev/null \
              || { echo "expected the internal flavor's APK paired"; exit 1; }
            jq -e '.modules.app.playRelease.apk | length == 1 and (.[0] | test("play-release"))' "$map" > /dev/null \
              || { echo "expected the play flavor's APK paired"; exit 1; }
            jq -e '.unmatched.mapping | length == 2 and all(startswith("compose-mapping"))' "$map" > /dev/null \
              || { echo "expected both Compose mappings under unmatched"; exit 1; }
            echo "OK: both flavors paired with their own official outputs/ mapping; Compose mappings in unmatched"
    - save-gradle-cache@1:
        is_always_run: true

  test_repeated_runs:
    description: Two runs of the step in one workflow merge into a single artifact map
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _second_run_release
    - _check_output_artifact_map
    - _check_merged_artifact_map

  _second_run_release:
    steps:
    - path::./:
        title: Self-test second run (release)
        inputs:
        - build_root_directory: $BUILD_ROOT_DIRECTORY
        - gradle_task: assembleRelease
        - gradlew_path: $GRADLEW_PATH
        - gradle_options: $GRADLE_OPTIONS
        - mapping_file_include_filter: $MAPPING_FILE_INCLUDE_FILTER
        - collect_metrics: $COLLECT_METRICS

  _check_merged_artifact_map:
    steps:
    - script:
        title: Check that both runs' variants are in the artifact map
        is_always_run: true
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            count=$(jq '[.modules[][]] | length' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH")
            if [ "$count" -lt 2 ]; then
              echo "expected the merged artifact map to contain both runs' variants, got $count:"
              cat "$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
              exit 1
            fi
            jq -e '.modules.app | has("debug") and has("release")' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" > /dev/null \
              || { echo "expected app module's debug and release variants in the merged map"; exit 1; }
            echo "merged artifact map contains $count variants"

  test_gradle_kts:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-gradle-kotlin-dsl.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  test_metrics:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/bitrise-android-sample.git
    - TEST_APP_BRANCH: main
    - CLONE_INTO_DIR: ./src
    - BUILD_ROOT_DIRECTORY: ./src
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --stacktrace
    - COLLECT_METRICS: "yes"
    after_run:
    - _common
    - _check_output_apk

  _common:
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: recreate _tmp directory
        inputs:
        - content: rm -rf "$ORIG_BITRISE_SOURCE_DIR/_tmp" && mkdir "$ORIG_BITRISE_SOURCE_DIR/_tmp"
    - change-workdir:
        title: Switch working dir to _tmp dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file', which would work for local tests
          but not if the step is included in another bitrise.yml!
        run_if: "true"
        inputs:
        - path: $ORIG_BITRISE_SOURCE_DIR/_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: $CLONE_INTO_DIR
        - branch: $TEST_APP_BRANCH
    # Older fixture apps (e.g. sample-apps-android-sdk22) pin compileSdkVersion
    # to a platform that the current CI image does not pre-install. Run the
    # standard installer so gradle can resolve the requested platform/build-tools
    # before the self-test step starts compiling.
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: $CLONE_INTO_DIR/$GRADLEW_PATH
    # Belt-and-braces: pre-install the legacy SDK platforms the e2e fixtures
    # pin. install-missing-android-tools' static parser doesn't always pick
    # up `compileSdkVersion 27` from every sample (e.g. sample-apps-android-
    # abi-split), and gradle's own mid-build sdkmanager auto-install has
    # been failing on the download step intermittently. Installing the
    # platforms explicitly with retry keeps the e2e off that hot path.
    - script:
        title: Pre-install legacy Android SDK platforms
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # No `pipefail`: `yes | sdkmanager` dies from SIGPIPE (141) once
            # sdkmanager closes its stdin, which pipefail would otherwise
            # propagate as a pipeline failure even when sdkmanager itself
            # exited 0.
            set -u
            sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            for attempt in 1 2 3; do
              status=0
              yes | "$sdkmanager" "platforms;android-27" || status=$?
              if [ "$status" -eq 0 ]; then
                exit 0
              fi
              echo "sdkmanager attempt $attempt exited $status, retrying..." >&2
              sleep $((attempt * 5))
            done
            exit 1
    - path::./:
        title: Self-test
        inputs:
        - build_root_directory: $BUILD_ROOT_DIRECTORY
        - gradle_task: $GRADLE_TASK
        - gradlew_path: $GRADLEW_PATH
        - gradle_options: $GRADLE_OPTIONS
        - mapping_file_include_filter: $MAPPING_FILE_INCLUDE_FILTER
        - collect_metrics: $COLLECT_METRICS
    - script:
        title: Log outputs
        is_always_run: true
        inputs:
        - content: |-
            #!/bin/bash
            echo "[output] BITRISE_APK_PATH: ${BITRISE_APK_PATH}"
            echo "[output] BITRISE_APK_PATH_LIST: ${BITRISE_APK_PATH_LIST}"
            echo "[output] BITRISE_AAB_PATH: ${BITRISE_AAB_PATH}"
            echo "[output] BITRISE_AAB_PATH_LIST: ${BITRISE_AAB_PATH_LIST}"
            echo "[output] BITRISE_MAPPING_PATH: ${BITRISE_MAPPING_PATH}"
            echo "[output] BITRISE_ANDROID_ARTIFACT_MAP_PATH: ${BITRISE_ANDROID_ARTIFACT_MAP_PATH}"

            set -x
            ls -alh "$BITRISE_DEPLOY_DIR"

  # NOTE: this helper asserts `.variants` is non-empty, so only attach it to
  # workflows whose build produces variant-attributable artifacts (the standard
  # build/outputs/{apk,bundle,mapping} layout). A map with only `unmatched`
  # entries is contract-conformant but would fail this check.
  _check_output_artifact_map:
    steps:
    - script:
        title: Check the variant-keyed artifact map output
        is_always_run: true
        inputs:
        - content: |-
            #!/bin/bash
            set -e
            if [ -z "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" ]; then
              echo "BITRISE_ANDROID_ARTIFACT_MAP_PATH env is empty"
              exit 1
            fi
            if [ ! -f "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" ]; then
              echo "Artifact map not found at '${BITRISE_ANDROID_ARTIFACT_MAP_PATH}'"
              exit 1
            fi
            echo "--- artifact map ---"
            cat "$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            echo "--------------------"

            jq -e '.version == 1' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" > /dev/null \
              || { echo "artifact map schema version is not 1"; exit 1; }
            jq -e '[.modules[][]] | length > 0' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" > /dev/null \
              || { echo "artifact map has no variants"; exit 1; }

            # Every file the map references — variant entries AND unmatched —
            # must exist next to the map file. read -r keeps file names with
            # spaces intact.
            map_dir=$(dirname "$BITRISE_ANDROID_ARTIFACT_MAP_PATH")
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              if [ ! -f "$map_dir/$name" ]; then
                echo "artifact map references '$name' but it does not exist in $map_dir"
                exit 1
              fi
              echo "artifact map entry exists: $name"
            done < <(jq -r '(.modules[][] | (.mapping // empty), .apk[], .aab[]), (.unmatched | .apk[], .aab[], .mapping[])' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH")

  _check_output_aab:
    steps:
    - script:
        title: Check if aab output exists
        is_always_run: true
        inputs:
        - content: |-
            set -e
            if [ ! -f "$BITRISE_AAB_PATH" ]; then
              echo "AAB bundle not found at '${BITRISE_AAB_PATH}'"
              exit 1
            fi
            echo "AAB bundle found at '${BITRISE_AAB_PATH}'"

  _check_output_apk:
    steps:
    - script:
        title: Check if apk output exists
        is_always_run: true
        inputs:
        - content: |-
            set -e
            if [ ! -f "$BITRISE_APK_PATH" ]; then
              echo "APK not found at '${BITRISE_APK_PATH}'"
              exit 1
            fi
            echo "APK found at '${BITRISE_APK_PATH}'"

  _check_log_output:
    steps:
    - script:
        title: Check if log file exists and environment variable is set
        is_always_run: true
        inputs:
        - content: |-
            if [ -z "$BITRISE_GRADLE_RAW_RESULT_TEXT_PATH" ] ; then
              echo "BITRISE_GRADLE_RAW_RESULT_TEXT_PATH env is empty"
              exit 1
            fi

            if [ ! -f "$BITRISE_GRADLE_RAW_RESULT_TEXT_PATH" ]; then
                echo "Log file not found at ${BITRISE_GRADLE_RAW_RESULT_TEXT_PATH}"
                exit 1
            fi
            echo "Log file found at ${BITRISE_GRADLE_RAW_RESULT_TEXT_PATH}"

            envman add --key BITRISE_GRADLE_RAW_RESULT_TEXT_PATH --value ""
