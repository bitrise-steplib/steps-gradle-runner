format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  # Shared test configs
  - ORIG_BITRISE_SOURCE_DIR: $BITRISE_SOURCE_DIR
  - BUILD_ROOT_DIRECTORY: .
  - MAPPING_FILE_INCLUDE_FILTER: "*/release/mapping.txt"
  - JAVA_VERSION: "17"
  # only the workflows building a project with native sources need these
  - NDK_VERSION: ""
  - INIT_SUBMODULES: "false"

workflows:
  test:
    description: Debug option specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --debug
    after_run:
    - _common
    - _check_output_apk
    - _check_log_output

  test_invalid_task:
    steps:
    - script:
        title: Start a failing workflow, wrapped in a script.
        inputs:
        - content: |-
            #!/bin/env bash
            set -x # Do not set -e as bitrise command is expected to fail
            bitrise run --config=./e2e/bitrise.yml utility_test_invalid_task
            if [ $? -ne 1 ] ; then
              echo "Workflow was excepted to fail, exit code not 1."
              exit 1
            fi

  utility_test_invalid_task:
    description: Invalid task specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: nonexistentTask
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    after_run:
    - _common

  test_invalid_task_debug:
    steps:
    - script:
        title: Start a failing workflow, wrapped in a script.
        inputs:
        - content: |-
            #!/bin/env bash
            set -x # Do not set -e as bitrise command is expected to fail
            bitrise run --config=./e2e/bitrise.yml utility_test_invalid_task_debug
            if [ $? -ne 1 ] ; then
              echo "Workflow was excepted to fail, exit code not 1."
              exit 1
            fi

  utility_test_invalid_task_debug:
    description: Invalid task specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: nonexistentTask
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --debug
    after_run:
    - _common
    - _check_log_output

  test_aab:
    description: App bundle (.aab)
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: bundle
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    after_run:
    - _common
    - _check_output_aab

  test_gradlew_path:
    description: Use 'gradlew' as Gradle wrapper path
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: gradlew
    - GRADLE_OPTIONS: ""
    after_run:
    - _common
    - _check_output_apk

  test_multiple_tasks:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug assembleRelease
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    after_run:
    - _common
    - _check_output_apk

  test_subdir:
    description: Source code is in a subdirectory
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: ./src
    - BUILD_ROOT_DIRECTORY: ./src
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    after_run:
    - _common
    - _check_output_apk

  test-no-gradlew-error:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-sdk22-no-gradlew.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ""
    - GRADLE_OPTIONS: ""
    after_run:
    - _common
    - _check_output_apk

  # Ouptuts an *.aar
  test_no_root_buildfile:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-empty-library.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    after_run:
    - _common

  test_apk_split:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-abi-split.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    after_run:
    - _common
    - _check_output_apk

  test_gradle_kts:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-gradle-kotlin-dsl.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    after_run:
    - _common
    - _check_output_apk

  test_metrics:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/bitrise-android-sample.git
    - TEST_APP_BRANCH: main
    - CLONE_INTO_DIR: ./src
    - BUILD_ROOT_DIRECTORY: ./src
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --stacktrace
    after_run:
    - _common
    - _check_output_apk

  # SSW-3065 on the app that produced the report: two minified Compose flavors, so
  # every variant has all three mapping files (published, R8 task copy, Compose) and
  # they collide by name in the deploy dir. Heavy build, so it runs on one stack.
  test_duckduckgo:
    steps:
    - script:
        title: Run the DuckDuckGo e2e (latest Ubuntu stack only)
        run_if: |-
          {{ or (enveq "IS_LATEST_STACK_UBUNTU" "true") (not .IsCI) }}
        inputs:
        - content: bitrise run --config=./e2e/bitrise.yml utility_test_duckduckgo

  utility_test_duckduckgo:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/DuckDuckGo-Android.git
    # enables R8 on release, uses a Bitrise-owned application id, dontwarns the
    # leaked compile-only lint classes and sizes the gradle/kotlin daemon heap
    - TEST_APP_BRANCH: SSW-3065-minified-fixture
    - CLONE_INTO_DIR: .
    - INIT_SUBMODULES: "true"
    - JAVA_VERSION: "21"
    - NDK_VERSION: 28.2.13676358
    - GRADLE_TASK: assembleInternalRelease assemblePlayRelease
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: -PuseProprietaryFont=false
    # the reporter's own, widened include filter: it matches compose-mapping.txt too
    - MAPPING_FILE_INCLUDE_FILTER: "*mapping.txt"
    # the other e2e workflows share the build's deploy dir and leave a mapping.txt
    # there, which would rename this workflow's exports whatever the filters do
    - BITRISE_DEPLOY_DIR: $HOME/deploy-duckduckgo
    steps:
    - script:
        title: recreate the dedicated deploy dir
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # fail loudly instead of wiping the build's shared deploy dir, should the
            # workflow-level override above ever stop winning
            case "$BITRISE_DEPLOY_DIR" in
            */deploy-duckduckgo) ;;
            *)
              echo "BITRISE_DEPLOY_DIR is not the dedicated dir: ${BITRISE_DEPLOY_DIR}"
              exit 1
              ;;
            esac
            rm -rf "$BITRISE_DEPLOY_DIR"
            mkdir -p "$BITRISE_DEPLOY_DIR"
    - restore-gradle-cache@2:
    after_run:
    - _common
    - _save_duckduckgo_gradle_cache
    - _check_duckduckgo_mappings

  _common:
    steps:
    - set-java-version:
        inputs:
        - set_java_version: $JAVA_VERSION
    - script:
        title: recreate _tmp directory
        inputs:
        - content: rm -rf "$ORIG_BITRISE_SOURCE_DIR/_tmp" && mkdir "$ORIG_BITRISE_SOURCE_DIR/_tmp"
    - change-workdir:
        title: Switch working dir to _tmp dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file', which would work for local tests
          but not if the step is included in another bitrise.yml!
        run_if: "true"
        inputs:
        - path: $ORIG_BITRISE_SOURCE_DIR/_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: $CLONE_INTO_DIR
        - branch: $TEST_APP_BRANCH
    - script:
        title: Init git submodules
        run_if: |-
          {{ enveq "INIT_SUBMODULES" "true" }}
        inputs:
        - content: cd "$CLONE_INTO_DIR" && git submodule update --init --recursive --depth 1
    # Older fixture apps (e.g. sample-apps-android-sdk22) pin compileSdkVersion
    # to a platform that the current CI image does not pre-install. Run the
    # standard installer so gradle can resolve the requested platform/build-tools
    # before the self-test step starts compiling.
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: $CLONE_INTO_DIR/$GRADLEW_PATH
        - ndk_version: $NDK_VERSION
    # Belt-and-braces: pre-install the legacy SDK platforms the e2e fixtures
    # pin. install-missing-android-tools' static parser doesn't always pick
    # up `compileSdkVersion 27` from every sample (e.g. sample-apps-android-
    # abi-split), and gradle's own mid-build sdkmanager auto-install has
    # been failing on the download step intermittently. Installing the
    # platforms explicitly with retry keeps the e2e off that hot path.
    - script:
        title: Pre-install legacy Android SDK platforms
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # No `pipefail`: `yes | sdkmanager` dies from SIGPIPE (141) once
            # sdkmanager closes its stdin, which pipefail would otherwise
            # propagate as a pipeline failure even when sdkmanager itself
            # exited 0.
            set -u
            sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            for attempt in 1 2 3; do
              status=0
              yes | "$sdkmanager" "platforms;android-27" || status=$?
              if [ "$status" -eq 0 ]; then
                exit 0
              fi
              echo "sdkmanager attempt $attempt exited $status, retrying..." >&2
              sleep $((attempt * 5))
            done
            exit 1
    - path::./:
        title: Self-test
        inputs:
        - build_root_directory: $BUILD_ROOT_DIRECTORY
        - gradle_task: $GRADLE_TASK
        - gradlew_path: $GRADLEW_PATH
        - gradle_options: $GRADLE_OPTIONS
        - mapping_file_include_filter: $MAPPING_FILE_INCLUDE_FILTER
    - script:
        title: Log outputs
        is_always_run: true
        inputs:
        - content: |-
            #!/bin/bash
            echo "[output] BITRISE_APK_PATH: ${BITRISE_APK_PATH}"
            echo "[output] BITRISE_APK_PATH_LIST: ${BITRISE_APK_PATH_LIST}"
            echo "[output] BITRISE_AAB_PATH: ${BITRISE_AAB_PATH}"
            echo "[output] BITRISE_AAB_PATH_LIST: ${BITRISE_AAB_PATH_LIST}"
            echo "[output] BITRISE_MAPPING_PATH: ${BITRISE_MAPPING_PATH}"

            set -x
            ls -alh "$BITRISE_DEPLOY_DIR"

  _check_output_aab:
    steps:
    - script:
        title: Check if aab output exists
        is_always_run: true
        inputs:
        - content: |-
            set -e
            if [ ! -f "$BITRISE_AAB_PATH" ]; then
              echo "AAB bundle not found at '${BITRISE_AAB_PATH}'"
              exit 1
            fi
            echo "AAB bundle found at '${BITRISE_AAB_PATH}'"

  _check_output_apk:
    steps:
    - script:
        title: Check if apk output exists
        is_always_run: true
        inputs:
        - content: |-
            set -e
            if [ ! -f "$BITRISE_APK_PATH" ]; then
              echo "APK not found at '${BITRISE_APK_PATH}'"
              exit 1
            fi
            echo "APK found at '${BITRISE_APK_PATH}'"

  _save_duckduckgo_gradle_cache:
    steps:
    - save-gradle-cache@1:

  _check_duckduckgo_mappings:
    steps:
    - script:
        title: Check that only the published mapping files were exported
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail

            mapping_path="${BITRISE_MAPPING_PATH:-}"
            mapping_list="${BITRISE_MAPPING_PATH_LIST:-}"
            # cleared up front: a later workflow must not see this workflow's own
            # deploy dir, not even when an assertion below fails
            envman add --key BITRISE_MAPPING_PATH --value ""
            envman add --key BITRISE_MAPPING_PATH_LIST --value ""

            echo "[output] BITRISE_MAPPING_PATH: ${mapping_path}"
            echo "[output] BITRISE_MAPPING_PATH_LIST: ${mapping_list}"
            ls -alh "$BITRISE_DEPLOY_DIR" || true

            if [ ! -f "$mapping_path" ]; then
              echo "BITRISE_MAPPING_PATH is not a file: '${mapping_path}'"
              exit 1
            fi

            # Both flavors publish outputs/mapping/<flavor>Release/mapping.txt, so one
            # of the two is collision-renamed. The R8 task's own copies and the Compose
            # mapping files would show up here as further files.
            mappings=$(find "$BITRISE_DEPLOY_DIR" -maxdepth 1 -name "*mapping*.txt" | sort)
            echo "Exported mapping files:"
            echo "$mappings"

            if [ "$(printf '%s' "$mappings" | grep -c . || true)" -ne 2 ]; then
              echo "Expected the 2 published mapping files, one per flavor"
              exit 1
            fi

            # Every exported file is a real R8 mapping: a Compose mapping is not one.
            while read -r file; do
              head -1 "$file" | grep -q "compiler: R8" || {
                echo "Not an R8 mapping: ${file}"
                head -3 "$file"
                exit 1
              }
            done <<< "$mappings"

            # The two belong to different flavors. Exporting a variant's mapping twice
            # (once as published, once from the R8 task dir) would make them identical.
            distinct=$(while read -r file; do cksum < "$file"; done <<< "$mappings" | sort -u | grep -c .)
            if [ "$distinct" -ne 2 ]; then
              echo "The 2 exported mapping files have the same content"
              exit 1
            fi

            # -ef, not string equality: the step's path went through filepath.Clean.
            env_is_exported=false
            while read -r file; do
              if [ "$file" -ef "$mapping_path" ]; then
                env_is_exported=true
              fi
            done <<< "$mappings"
            if [ "$env_is_exported" != "true" ]; then
              echo "BITRISE_MAPPING_PATH is not one of the exported mapping files"
              exit 1
            fi

            # BITRISE_MAPPING_PATH_LIST must hold every exported mapping, not just the
            # last one. This is what lets a consumer pair each artifact with its own
            # mapping by pg_map_id; the singular variable cannot express two flavors.
            listed=$(printf '%s' "$mapping_list" | tr '|' '\n' | grep -c . || true)
            if [ "$listed" -ne 2 ]; then
              echo "Expected BITRISE_MAPPING_PATH_LIST to hold 2 paths, got ${listed}: '${mapping_list}'"
              exit 1
            fi

            # Herestring, not a pipe: a piped `while read` runs in a subshell where
            # `exit 1` would not fail this script.
            listed_files=$(printf '%s' "$mapping_list" | tr '|' '\n' | grep . | sort)
            while read -r file; do
              if [ ! -f "$file" ]; then
                echo "Listed mapping file does not exist: '${file}'"
                exit 1
              fi
              head -1 "$file" | grep -q "compiler: R8" || {
                echo "Listed file is not an R8 mapping: ${file}"
                exit 1
              }
              grep -q "^# pg_map_id: " "$file" || {
                echo "Listed mapping has no pg_map_id header, pairing would be impossible: ${file}"
                exit 1
              }
            done <<< "$listed_files"

            # The list is exactly the set found on disk.
            if [ "$listed_files" != "$mappings" ]; then
              echo "BITRISE_MAPPING_PATH_LIST does not match the exported mapping files"
              echo "listed:   ${listed_files}"
              echo "on disk:  ${mappings}"
              exit 1
            fi

            echo "OK: only the 2 published R8 mapping files were exported, and both are in the list"

  _check_log_output:
    steps:
    - script:
        title: Check if log file exists and environment variable is set
        is_always_run: true
        inputs:
        - content: |-
            if [ -z "$BITRISE_GRADLE_RAW_RESULT_TEXT_PATH" ] ; then
              echo "BITRISE_GRADLE_RAW_RESULT_TEXT_PATH env is empty"
              exit 1
            fi

            if [ ! -f "$BITRISE_GRADLE_RAW_RESULT_TEXT_PATH" ]; then
                echo "Log file not found at ${BITRISE_GRADLE_RAW_RESULT_TEXT_PATH}"
                exit 1
            fi
            echo "Log file found at ${BITRISE_GRADLE_RAW_RESULT_TEXT_PATH}"

            envman add --key BITRISE_GRADLE_RAW_RESULT_TEXT_PATH --value ""
