format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  # Shared test configs
  - ORIG_BITRISE_SOURCE_DIR: $BITRISE_SOURCE_DIR
  - BUILD_ROOT_DIRECTORY: .
  - MAPPING_FILE_INCLUDE_FILTER: "*/release/mapping.txt"

workflows:
  test:
    description: Debug option specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --debug
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk
    - _check_log_output

  test_invalid_task:
    steps:
    - script:
        title: Start a failing workflow, wrapped in a script.
        inputs:
        - content: |-
            #!/bin/env bash
            set -x # Do not set -e as bitrise command is expected to fail
            bitrise run --config=./e2e/bitrise.yml utility_test_invalid_task
            if [ $? -ne 1 ] ; then
              echo "Workflow was excepted to fail, exit code not 1."
              exit 1
            fi

  utility_test_invalid_task:
    description: Invalid task specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: nonexistentTask
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common

  test_invalid_task_debug:
    steps:
    - script:
        title: Start a failing workflow, wrapped in a script.
        inputs:
        - content: |-
            #!/bin/env bash
            set -x # Do not set -e as bitrise command is expected to fail
            bitrise run --config=./e2e/bitrise.yml utility_test_invalid_task_debug
            if [ $? -ne 1 ] ; then
              echo "Workflow was excepted to fail, exit code not 1."
              exit 1
            fi

  utility_test_invalid_task_debug:
    description: Invalid task specified
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: nonexistentTask
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --debug
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_log_output

  test_aab:
    description: App bundle (.aab)
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: bundle
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_aab

  test_gradlew_path:
    description: Use 'gradlew' as Gradle wrapper path
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  test_multiple_tasks:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug assembleRelease
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  test_subdir:
    description: Source code is in a subdirectory
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-sdk22.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: ./src
    - BUILD_ROOT_DIRECTORY: ./src
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  test-no-gradlew-error:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-sdk22-no-gradlew.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ""
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  # Ouptuts an *.aar
  test_no_root_buildfile:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-empty-library.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common

  test_apk_split:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/sample-apps-android-abi-split.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  test_gradle_kts:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-samples/android-gradle-kotlin-dsl.git
    - TEST_APP_BRANCH: master
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: ""
    - COLLECT_METRICS: "no"
    after_run:
    - _common
    - _check_output_apk

  test_metrics:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/bitrise-android-sample.git
    - TEST_APP_BRANCH: main
    - CLONE_INTO_DIR: ./src
    - BUILD_ROOT_DIRECTORY: ./src
    - GRADLE_TASK: assembleDebug
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --stacktrace
    - COLLECT_METRICS: "yes"
    after_run:
    - _common
    - _check_output_apk

  # SSW-3065: gradle publishes the mapping file to build/outputs, but the R8 task
  # leaves a working copy with the same file name under build/intermediates, and a
  # Compose build adds a compose-mapping.txt next to it. Exporting all of them made
  # the deploy directory rename the colliding copies, so BITRISE_MAPPING_PATH could
  # end up pointing at a renamed file the reporter could not identify. The default
  # mapping_file_exclude_filter has to keep the published file only.
  test_mapping_file_layout:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/bitrise-android-sample.git
    - TEST_APP_BRANCH: main
    - CLONE_INTO_DIR: .
    - GRADLE_TASK: exportMappingFileFixture
    - GRADLEW_PATH: ./gradlew
    - GRADLE_OPTIONS: --init-script $ORIG_BITRISE_SOURCE_DIR/e2e/fixtures/mapping-file-layout.gradle
    # The reporter's own, widened include filter: it matches compose-mapping.txt too.
    - MAPPING_FILE_INCLUDE_FILTER: "*mapping.txt"
    - COLLECT_METRICS: "no"
    # The other e2e workflows share the build's deploy dir and leave a mapping.txt
    # there, which would rename this workflow's export whatever the filters do. Use
    # a dedicated deploy dir, so that the exported file name means something.
    - BITRISE_DEPLOY_DIR: $HOME/deploy-mapping-file-layout
    steps:
    - script:
        title: recreate the dedicated deploy dir
        inputs:
        - content: rm -rf "$BITRISE_DEPLOY_DIR" && mkdir -p "$BITRISE_DEPLOY_DIR"
    after_run:
    - _common
    - _check_mapping_file_layout

  _common:
    steps:
    - set-java-version:
        inputs:
        - set_java_version: "17"
    - script:
        title: recreate _tmp directory
        inputs:
        - content: rm -rf "$ORIG_BITRISE_SOURCE_DIR/_tmp" && mkdir "$ORIG_BITRISE_SOURCE_DIR/_tmp"
    - change-workdir:
        title: Switch working dir to _tmp dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file', which would work for local tests
          but not if the step is included in another bitrise.yml!
        run_if: "true"
        inputs:
        - path: $ORIG_BITRISE_SOURCE_DIR/_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: $CLONE_INTO_DIR
        - branch: $TEST_APP_BRANCH
    # Older fixture apps (e.g. sample-apps-android-sdk22) pin compileSdkVersion
    # to a platform that the current CI image does not pre-install. Run the
    # standard installer so gradle can resolve the requested platform/build-tools
    # before the self-test step starts compiling.
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: $CLONE_INTO_DIR/$GRADLEW_PATH
    # Belt-and-braces: pre-install the legacy SDK platforms the e2e fixtures
    # pin. install-missing-android-tools' static parser doesn't always pick
    # up `compileSdkVersion 27` from every sample (e.g. sample-apps-android-
    # abi-split), and gradle's own mid-build sdkmanager auto-install has
    # been failing on the download step intermittently. Installing the
    # platforms explicitly with retry keeps the e2e off that hot path.
    - script:
        title: Pre-install legacy Android SDK platforms
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # No `pipefail`: `yes | sdkmanager` dies from SIGPIPE (141) once
            # sdkmanager closes its stdin, which pipefail would otherwise
            # propagate as a pipeline failure even when sdkmanager itself
            # exited 0.
            set -u
            sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            for attempt in 1 2 3; do
              status=0
              yes | "$sdkmanager" "platforms;android-27" || status=$?
              if [ "$status" -eq 0 ]; then
                exit 0
              fi
              echo "sdkmanager attempt $attempt exited $status, retrying..." >&2
              sleep $((attempt * 5))
            done
            exit 1
    - path::./:
        title: Self-test
        inputs:
        - build_root_directory: $BUILD_ROOT_DIRECTORY
        - gradle_task: $GRADLE_TASK
        - gradlew_path: $GRADLEW_PATH
        - gradle_options: $GRADLE_OPTIONS
        - mapping_file_include_filter: $MAPPING_FILE_INCLUDE_FILTER
        - collect_metrics: $COLLECT_METRICS
    - script:
        title: Log outputs
        is_always_run: true
        inputs:
        - content: |-
            #!/bin/bash
            echo "[output] BITRISE_APK_PATH: ${BITRISE_APK_PATH}"
            echo "[output] BITRISE_APK_PATH_LIST: ${BITRISE_APK_PATH_LIST}"
            echo "[output] BITRISE_AAB_PATH: ${BITRISE_AAB_PATH}"
            echo "[output] BITRISE_AAB_PATH_LIST: ${BITRISE_AAB_PATH_LIST}"
            echo "[output] BITRISE_MAPPING_PATH: ${BITRISE_MAPPING_PATH}"

            set -x
            ls -alh "$BITRISE_DEPLOY_DIR"

  _check_output_aab:
    steps:
    - script:
        title: Check if aab output exists
        is_always_run: true
        inputs:
        - content: |-
            set -e
            if [ ! -f "$BITRISE_AAB_PATH" ]; then
              echo "AAB bundle not found at '${BITRISE_AAB_PATH}'"
              exit 1
            fi
            echo "AAB bundle found at '${BITRISE_AAB_PATH}'"

  _check_output_apk:
    steps:
    - script:
        title: Check if apk output exists
        is_always_run: true
        inputs:
        - content: |-
            set -e
            if [ ! -f "$BITRISE_APK_PATH" ]; then
              echo "APK not found at '${BITRISE_APK_PATH}'"
              exit 1
            fi
            echo "APK found at '${BITRISE_APK_PATH}'"

  _check_mapping_file_layout:
    steps:
    - script:
        title: Check that only the published mapping file was exported
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -eo pipefail

            mapping_path="${BITRISE_MAPPING_PATH:-}"
            echo "[output] BITRISE_MAPPING_PATH: ${mapping_path}"
            ls -alh "$BITRISE_DEPLOY_DIR"

            if [ ! -f "$mapping_path" ]; then
              echo "BITRISE_MAPPING_PATH is not a file: '${mapping_path}'"
              exit 1
            fi

            # The fixture's own copies are identified by their content, so that a
            # renamed copy is caught wherever it landed.
            exported=$(grep -rlIF "fixture-source: app/build/" "$BITRISE_DEPLOY_DIR" || true)
            echo "Fixture mapping files in the deploy dir:"
            echo "$exported"

            if [ "$(echo "$exported" | grep -c .)" -ne 1 ]; then
              echo "Expected exactly 1 of the 3 fixture mapping files in the deploy dir"
              exit 1
            fi

            if [ "$exported" != "$mapping_path" ]; then
              echo "BITRISE_MAPPING_PATH does not point at the exported fixture file: ${exported}"
              exit 1
            fi

            # No name collision means no rename: the reporter's BITRISE_MAPPING_PATH
            # pointed at a mapping20260703072155.txt instead.
            if [ "$(basename "$mapping_path")" != "mapping.txt" ]; then
              echo "Expected the exported mapping file to keep its name, got $(basename "$mapping_path")"
              exit 1
            fi

            # ...and the exported one is the file gradle published, not a task copy.
            if ! grep -qF "fixture-source: app/build/outputs/mapping/productionRelease/mapping.txt" "$mapping_path"; then
              echo "BITRISE_MAPPING_PATH points at the wrong mapping file:"
              cat "$mapping_path"
              exit 1
            fi

            if [ -e "$BITRISE_DEPLOY_DIR/compose-mapping.txt" ]; then
              echo "The Compose mapping file was exported to the deploy dir"
              exit 1
            fi

            echo "OK: only app/build/outputs/mapping/productionRelease/mapping.txt was exported, as ${mapping_path}"

            envman add --key BITRISE_MAPPING_PATH --value ""

  _check_log_output:
    steps:
    - script:
        title: Check if log file exists and environment variable is set
        is_always_run: true
        inputs:
        - content: |-
            if [ -z "$BITRISE_GRADLE_RAW_RESULT_TEXT_PATH" ] ; then
              echo "BITRISE_GRADLE_RAW_RESULT_TEXT_PATH env is empty"
              exit 1
            fi

            if [ ! -f "$BITRISE_GRADLE_RAW_RESULT_TEXT_PATH" ]; then
                echo "Log file not found at ${BITRISE_GRADLE_RAW_RESULT_TEXT_PATH}"
                exit 1
            fi
            echo "Log file found at ${BITRISE_GRADLE_RAW_RESULT_TEXT_PATH}"

            envman add --key BITRISE_GRADLE_RAW_RESULT_TEXT_PATH --value ""
