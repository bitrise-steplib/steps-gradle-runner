// Fixture for the test_mapping_file_layout e2e workflow (SSW-3065).
//
// It recreates the mapping file layout of the original bug report without
// needing a Compose + R8 application:
//
//   app/build/intermediates/compose_mapping/productionRelease/compose-mapping.txt
//     the Jetpack Compose mapping file, not an R8/ProGuard mapping
//   app/build/intermediates/mapping/productionRelease/minifyProductionReleaseWithR8/mapping.txt
//     the working copy the R8 task leaves behind, same file name as the published one
//   app/build/outputs/mapping/productionRelease/mapping.txt
//     the mapping file gradle publishes, the only one that should be exported
//
// The files are written by a task instead of by this script, so that their
// modification time is newer than the gradle start time the step compares them
// against when deciding whether an artifact belongs to this build.
gradle.rootProject { rootProject ->
    def appBuildDir = new File(rootProject.projectDir, "app/build")

    rootProject.tasks.register("exportMappingFileFixture") {
        doLast {
            [
                "intermediates/compose_mapping/productionRelease/compose-mapping.txt",
                "intermediates/mapping/productionRelease/minifyProductionReleaseWithR8/mapping.txt",
                "outputs/mapping/productionRelease/mapping.txt",
            ].each { relativePath ->
                def mappingFile = new File(appBuildDir, relativePath)
                mappingFile.parentFile.mkdirs()
                // The marker makes each copy identifiable after it landed in the
                // deploy directory, no matter what name it was copied under.
                mappingFile.text = "fixture-source: app/build/${relativePath}\n"
                println("fixture: wrote ${mappingFile}")
            }
        }
    }
}
